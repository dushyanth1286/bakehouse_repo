# This is a Declarative Automation Bundle definition for bakehouse_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_bundle
  uuid: 7f93dded-3f2c-4d20-b81f-8aa2721422b7

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    presets:
      name_prefix: prod_
    default: true
    workspace:
      host: https://dbc-522ec9d1-e94e.cloud.databricks.com
    variables:
      catalog: bakehouse_analytics_dev
      schema: asset_bundle_schema
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-522ec9d1-e94e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/dushyanth1286@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/dushyanth1286@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_prod
      schema: asset_bundle_schema
    permissions:
      - user_name: dushyanth1286@gmail.com
        level: CAN_MANAGE
